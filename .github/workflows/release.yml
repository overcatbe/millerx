# On every version tag (v0.5.4, ...): build the Debian/Ubuntu, Arch and Slackware packages
# and attach them, plus the Slackware build files, to a GitHub release.
# Run by hand (Actions -> release -> Run workflow) it only builds, as a test: no release.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential debhelper \
            meson ninja-build pkgconf libgtk-3-dev libarchive-dev libwebp-dev
          dpkg-buildpackage -us -uc -b
          mkdir out && mv ../millerx_*.deb out/
      - uses: actions/upload-artifact@v4
        with: { name: deb, path: out/*.deb }

  arch:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed base-devel git meson ninja gtk3 libarchive libwebp hicolor-icon-theme
      - uses: actions/checkout@v4
      - name: Build Arch package
        run: |
          ver=${GITHUB_REF_NAME#v}
          git config --global --add safe.directory "$PWD"
          git archive --prefix=millerx-$ver/ -o packaging/arch/millerx-$ver.tar.gz HEAD
          useradd -m builder
          chown -R builder packaging/arch
          cd packaging/arch && su builder -c "makepkg --nodeps --noconfirm"
          mkdir -p ../../out && mv millerx-*.pkg.tar.zst ../../out/
      - uses: actions/upload-artifact@v4
        with: { name: arch, path: out/*.pkg.tar.zst }

  slackware:
    # Built on Slackware 15.0 (unofficial image by an SBo admin), so the package runs on
    # 15.0 and on -current. It's our own SlackBuild, run the way a user runs it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build .txz in Slackware 15.0
        run: |
          ver=$(sed -n "s/^  version : '\(.*\)',/\1/p" meson.build)
          git archive --prefix=millerx-$ver/ -o slackware/millerx-$ver.tar.gz HEAD
          mkdir -p out
          docker run --rm -v "$PWD:/src" -e VERSION=$ver aclemons/slackware:15.0-full bash -ec '
            # millerX needs meson 0.60+: stock 15.0 has 0.59, the official patches bring 1.11
            if [ "$(printf "0.60\n%s\n" "$(meson --version)" | sort -V | head -1)" != 0.60 ]; then
              echo "https://mirrors.slackware.com/slackware/slackware64-15.0/" > /etc/slackpkg/mirrors
              slackpkg -batch=on -default_answer=y update gpg
              slackpkg -batch=on -default_answer=y update
              slackpkg -batch=on -default_answer=y upgrade meson python3
            fi
            meson --version
            cd /src/slackware
            PKGTYPE=txz OUTPUT=/src/out ./millerx.SlackBuild
          '
          ls -l out
      - uses: actions/upload-artifact@v4
        with: { name: slackware, path: out/*.txz }

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [deb, arch, slackware]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Slackware build files + source
        run: |
          ver=${GITHUB_REF_NAME#v}
          git archive --prefix=millerx-$ver/ -o dist/millerx-$ver.tar.gz HEAD
          tar czf dist/millerx-$ver.SlackBuild.tar.gz --transform 's,^slackware,millerx,' slackware
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
